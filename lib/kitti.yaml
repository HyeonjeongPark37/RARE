dataset:
  type: 'kitti'
  data_dir:  #'/your_data_path/DATA/KITTIDataset'
  root_dir: '/'
  label_dir: #'/your_label_path/DATA/KITTIDataset/training/label_2'
  eval_cls: ['Car']
  # eval_cls: ['Car', 'Pedestrian','Cyclist'] 
  eval_dataset: 'kitti' 
  batch_size: 12
  num_workers: 8
  class_merging: False
  use_dontcare: False
  use_3d_center: True
  writelist: ['Car','Pedestrian','Cyclist']
  random_flip: 0.5
  random_crop: 0.5
  scale: 0.4
  shift: 0.1
  divalign_aug_prob: 0.7
  divalign_aug_strength: 'medium'


model:
  type: 'RARE' 
  backbone: 'dla34' 
  neck: 'DLAUp'
  num_feature_levels: 3
  dilation: False
  position_embedding: 'sine'  # 'sine' or 'learned'
  masks: False

optimizer:
  type: 'adam'
  lr: 0.001
  weight_decay: 0.00001

lr_scheduler:
  warmup: True  # 5 epoches, cosine warmup, init_lir=0.00001 in default
  decay_rate: 0.1
  decay_list: [250, 450, 700]
  
trainer:
  max_epoch: 800 
  eval_start: 100
  eval_frequency: 10 # evaluation interval (in epoch)
  save_frequency: 10 # checkpoint save interval (in epoch)
  disp_frequency: 100 # display interval (in batch)
  
tester:
  tester_metrics: 'kitti'
  threshold: 0.2  # confidence filter

  out_dir: '/outputs'
  resume_model: ''
  

  